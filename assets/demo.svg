<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes fadeIn1 { 0%, 10% { opacity: 0; transform: translateY(6px); } 20%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn2 { 0%, 30% { opacity: 0; transform: translateY(6px); } 40%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn3 { 0%, 55% { opacity: 0; transform: translateY(6px); } 65%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn4 { 0%, 75% { opacity: 0; transform: translateY(6px); } 85%, 100% { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1s infinite; }
      .step1 { animation: fadeIn1 8s infinite; }
      .step2 { animation: fadeIn2 8s infinite; }
      .step3 { animation: fadeIn3 8s infinite; }
      .step4 { animation: fadeIn4 8s infinite; }
      .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .ui-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Window Frame -->
  <g filter="url(#shadow)">
    <rect x="35" y="30" width="780" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect x="35" y="30" width="780" height="40" rx="12" fill="#0f172a"/>
    <path d="M35 58 h780 v12 h-780 z" fill="#0f172a"/>
    
    <!-- Window Controls -->
    <circle cx="58" cy="50" r="6" fill="#ef4444"/>
    <circle cx="78" cy="50" r="6" fill="#f59e0b"/>
    <circle cx="98" cy="50" r="6" fill="#10b981"/>

    <!-- Window Title -->
    <text x="425" y="55" fill="#94a3b8" font-size="12" text-anchor="middle" class="ui-font" font-weight="500">
      tidjan-undraw — Smart Match &amp; Auto-Palette AI Agent
    </text>

    <!-- Badge -->
    <rect x="700" y="41" width="95" height="18" rx="9" fill="url(#accentGrad)"/>
    <text x="747" y="54" fill="#ffffff" font-size="10" text-anchor="middle" class="ui-font" font-weight="700">v1.1.0 SMART</text>
  </g>

  <!-- Terminal Content -->
  <g class="code-font" font-size="13" transform="translate(60, 100)">
    <!-- Command Prompt -->
    <text x="0" y="0" fill="#10b981" font-weight="bold">➜</text>
    <text x="20" y="0" fill="#38bdf8" font-weight="bold">my-nextjs-app</text>
    <text x="135" y="0" fill="#f1f5f9">npx tidjan-undraw smart "page 404"</text>
    <rect x="390" y="-12" width="8" height="15" fill="#a855f7" class="cursor"/>

    <!-- Step 1: Project Inspection -->
    <g class="step1" transform="translate(0, 32)">
      <text x="0" y="0" fill="#818cf8" font-weight="bold">🔍 [Smart Match]</text>
      <text x="130" y="0" fill="#cbd5e1">Inspection du projet en cours...</text>
      <text x="20" y="22" fill="#64748b">├── Framework  :</text>
      <text x="145" y="22" fill="#38bdf8" font-weight="bold">Next.js 16 (App Router + TypeScript)</text>
      <text x="20" y="42" fill="#64748b">├── Palette    :</text>
      <text x="145" y="42" fill="#f43f5e" font-weight="bold">#3B82F6</text>
      <text x="215" y="42" fill="#94a3b8">(détecté depuis tailwind.config.ts)</text>
      <text x="20" y="62" fill="#64748b">└── Mode       :</text>
      <text x="145" y="62" fill="#a855f7" font-weight="bold">Dark / Light Adaptatif</text>
    </g>

    <!-- Step 2: Scoring Candidate Illustrations -->
    <g class="step2" transform="translate(0, 125)">
      <text x="0" y="0" fill="#f59e0b" font-weight="bold">🎯 [Candidates]</text>
      <text x="130" y="0" fill="#cbd5e1">Recherche &amp; analyse sémantique (unDraw API) :</text>
      <text x="20" y="22" fill="#94a3b8">1. Page not found</text>
      <text x="180" y="22" fill="#10b981">[Score: 98% - Match parfait 404]</text>
      <text x="20" y="42" fill="#94a3b8">2. Connection lost</text>
      <text x="180" y="42" fill="#64748b">[Score: 78% - Réseau / Hors-ligne]</text>
      <text x="20" y="62" fill="#94a3b8">3. Server error</text>
      <text x="180" y="62" fill="#64748b">[Score: 72% - Erreur 500]</text>
    </g>

    <!-- Step 3: Generation & Anti-duplicate -->
    <g class="step3" transform="translate(0, 218)">
      <text x="0" y="0" fill="#10b981" font-weight="bold">✨ [Génération]</text>
      <text x="130" y="0" fill="#f1f5f9">Meilleur choix sélectionné :</text>
      <text x="315" y="0" fill="#38bdf8" font-weight="bold">page-not-found</text>
      <text x="20" y="22" fill="#10b981">✔ SVG téléchargé :</text>
      <text x="160" y="22" fill="#cbd5e1">public/illustrations/page-not-found.svg</text>
      <text x="20" y="42" fill="#10b981">✔ Couleur appliquée :</text>
      <text x="175" y="42" fill="#3b82f6" font-weight="bold">#3B82F6</text>
      <text x="245" y="42" fill="#94a3b8">(remplace le violet #6C63FF)</text>
      <text x="20" y="62" fill="#10b981">✔ Composant React :</text>
      <text x="175" y="62" fill="#cbd5e1">components/illustrations/PageNotFound.tsx</text>
    </g>

    <!-- Step 4: Ready -->
    <g class="step4" transform="translate(0, 310)">
      <rect x="0" y="-8" width="500" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="11" fill="#6ee7b7" font-weight="bold">🚀 Prêt à l'emploi ! Intégré dans app/not-found.tsx avec Dark Mode</text>
    </g>
  </g>

  <!-- Illustration Card Preview on the right -->
  <g class="step3" transform="translate(585, 115)">
    <rect width="200" height="230" rx="10" fill="#0f172a" stroke="#4338ca" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="24" fill="#a5b4fc" font-size="11" text-anchor="middle" class="ui-font" font-weight="600">Aperçu Généré</text>
    
    <!-- Mini SVG Representation -->
    <g transform="translate(25, 45)">
      <!-- Monitor -->
      <rect x="25" y="15" width="100" height="70" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <rect x="32" y="22" width="86" height="56" rx="3" fill="#0f172a"/>
      <path d="M75 85 v20 M60 105 h30" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Screen 404 & Person in project primary color (#3B82F6) -->
      <text x="75" y="55" fill="#3B82F6" font-size="20" font-weight="900" text-anchor="middle" class="ui-font">404</text>
      <circle cx="120" cy="85" r="12" fill="#fbcfe8"/>
      <path d="M110 105 c0 -15 20 -15 20 0 z" fill="#3B82F6"/>
      <circle cx="40" cy="40" r="4" fill="#3B82F6" opacity="0.6"/>
      <circle cx="108" cy="30" r="3" fill="#a855f7" opacity="0.6"/>
    </g>

    <!-- Badge in Card -->
    <rect x="20" y="180" width="160" height="32" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <circle cx="35" cy="196" r="6" fill="#3B82F6"/>
    <text x="50" y="200" fill="#e0e7ff" font-size="11" class="ui-font" font-weight="600">Brand: #3B82F6</text>
    <text x="165" y="199" fill="#10b981" font-size="11" text-anchor="end" class="ui-font">✔ Auto</text>
  </g>
</svg>
