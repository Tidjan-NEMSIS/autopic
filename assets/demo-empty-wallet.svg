<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes animStep1 {
        0%, 5%   { opacity: 0; }
        12%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      @keyframes animStep2 {
        0%, 25%  { opacity: 0; }
        33%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      @keyframes animStep3 {
        0%, 50%  { opacity: 0; }
        58%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      @keyframes animStep4 {
        0%, 72%  { opacity: 0; }
        80%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      .cursor { animation: blink 1s infinite; }
      .step1  { animation: animStep1 10s infinite; }
      .step2  { animation: animStep2 10s infinite; }
      .step3  { animation: animStep3 10s infinite; }
      .step4  { animation: animStep4 10s infinite; }
      
      .code-font { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .ui-font   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Window Frame -->
  <g filter="url(#shadow)">
    <rect x="35" y="30" width="780" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect x="35" y="30" width="780" height="40" rx="12" fill="#0f172a"/>
    <path d="M35 58 h780 v12 h-780 z" fill="#0f172a"/>
    
    <!-- Window Controls -->
    <circle cx="58" cy="50" r="6" fill="#ef4444"/>
    <circle cx="78" cy="50" r="6" fill="#f59e0b"/>
    <circle cx="98" cy="50" r="6" fill="#10b981"/>

    <!-- Window Title -->
    <text x="425" y="55" fill="#94a3b8" font-size="12" text-anchor="middle" class="ui-font" font-weight="500">
      autopic — Intelligent Multi-Provider Illustration Platform
    </text>

    <!-- Badge -->
    <rect x="685" y="41" width="110" height="18" rx="9" fill="url(#accentGrad)"/>
    <text x="740" y="54" fill="#ffffff" font-size="10" text-anchor="middle" class="ui-font" font-weight="700">v2.0 MULTI-API</text>
  </g>

  <!-- Terminal Content -->
  <g class="code-font" font-size="13" transform="translate(60, 100)">
    <!-- Command Prompt -->
    <text x="0" y="0" fill="#10b981" font-weight="bold">➜</text>
    <text x="20" y="0" fill="#38bdf8" font-weight="bold">my-nextjs-app</text>
    <text x="135" y="0" fill="#f1f5f9">npx tidjan-autopic smart "empty wallet"</text>
    <rect x="440" y="-12" width="8" height="15" fill="#a855f7" class="cursor"/>

    <!-- Step 1: Project Inspection -->
    <g class="step1" transform="translate(0, 32)">
      <text x="0" y="0" fill="#818cf8" font-weight="bold">🔍 [Smart Match]</text>
      <text x="130" y="0" fill="#cbd5e1">Inspection du projet en cours...</text>
      <text x="20" y="22" fill="#64748b">├── Framework  :</text>
      <text x="165" y="22" fill="#38bdf8" font-weight="bold">Next.js 16 (App Router + TS)</text>
      <text x="20" y="42" fill="#64748b">├── Composant  :</text>
      <text x="165" y="42" fill="#f43f5e" font-weight="bold">empty-state (billing / wallet)</text>
      <text x="20" y="62" fill="#64748b">└── Palette    :</text>
      <text x="165" y="62" fill="#3b82f6" font-weight="bold">#3B82F6</text>
      <text x="235" y="62" fill="#94a3b8">(tailwind.config.ts)</text>
    </g>

    <!-- Step 2: Scoring Candidate Illustrations -->
    <g class="step2" transform="translate(0, 125)">
      <text x="0" y="0" fill="#f59e0b" font-weight="bold">🎯 [Candidats]</text>
      <text x="125" y="0" fill="#cbd5e1">Scoring sémantique multi-sources :</text>
      <text x="20" y="22" fill="#94a3b8">1. Empty Wallet</text>
      <text x="190" y="22" fill="#10b981">[unDraw - 95% match]</text>
      <text x="20" y="42" fill="#94a3b8">2. Sitting Confused</text>
      <text x="190" y="42" fill="#64748b">[OpenPeeps - 77% CC0]</text>
      <text x="20" y="62" fill="#94a3b8">3. Financial Loss</text>
      <text x="190" y="62" fill="#64748b">[IRADesign - 70% MIT]</text>
    </g>

    <!-- Step 3: Generation & Anti-duplicate -->
    <g class="step3" transform="translate(0, 218)">
      <text x="0" y="0" fill="#10b981" font-weight="bold">✨ [Génération]</text>
      <text x="130" y="0" fill="#f1f5f9">Choix retenu :</text>
      <text x="250" y="0" fill="#38bdf8" font-weight="bold">empty-wallet_j0kn</text>
      <text x="20" y="22" fill="#10b981">✔ SVG téléchargé  :</text>
      <text x="180" y="22" fill="#cbd5e1">public/illustrations/empty-wallet_j0kn.svg</text>
      <text x="20" y="42" fill="#10b981">✔ Auto-Palette    :</text>
      <text x="180" y="42" fill="#3b82f6" font-weight="bold">#3B82F6</text>
      <text x="250" y="42" fill="#94a3b8">(remplace #6C63FF)</text>
      <text x="20" y="62" fill="#10b981">✔ Composant React :</text>
      <text x="180" y="62" fill="#cbd5e1">components/illustrations/EmptyWallet.tsx</text>
    </g>

    <!-- Step 4: Ready -->
    <g class="step4" transform="translate(0, 310)">
      <rect x="0" y="-8" width="505" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="11" fill="#6ee7b7" font-weight="bold">🚀 Prêt ! Intégré dans components/billing/EmptyWallet.tsx</text>
    </g>
  </g>

  <!-- Illustration Card Preview on the right -->
  <g class="step3" transform="translate(580, 115)">
    <rect width="210" height="235" rx="10" fill="#0f172a" stroke="#4338ca" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="105" y="24" fill="#a5b4fc" font-size="11" text-anchor="middle" class="ui-font" font-weight="600">Aperçu Intégré</text>
    
    <!-- Mini SVG Representation: Empty Wallet in brand color -->
    <g transform="translate(25, 45)">
      <!-- Back card in pocket -->
      <rect x="35" y="15" width="90" height="30" rx="4" fill="#3B82F6" opacity="0.85"/>
      <line x1="45" y1="23" x2="75" y2="23" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
      
      <!-- Wallet main body -->
      <rect x="25" y="28" width="110" height="75" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <!-- Inner texture / stitches -->
      <path d="M25 42 Q80 52 135 42" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>
      
      <!-- Wallet flap & clasp with primary color -->
      <path d="M105 52 h26 a8 8 0 0 1 8 8 v8 a8 8 0 0 1 -8 8 h-26 z" fill="#3B82F6"/>
      <circle cx="127" cy="64" r="3.5" fill="#ffffff"/>
      
      <!-- Empty zero coin -->
      <circle cx="55" cy="65" r="15" fill="#0f172a" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="55" y="70" fill="#3B82F6" font-size="13" font-weight="800" text-anchor="middle" class="ui-font">0€</text>
      
      <!-- Wind / emptiness decorative dashes -->
      <path d="M15 78 Q22 72 32 76" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M130 20 Q138 15 145 18" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Badge in Card -->
    <rect x="25" y="185" width="160" height="32" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <circle cx="40" cy="201" r="6" fill="#3B82F6"/>
    <text x="55" y="205" fill="#e0e7ff" font-size="11" class="ui-font" font-weight="600">Palette: #3B82F6</text>
    <text x="170" y="204" fill="#10b981" font-size="11" text-anchor="end" class="ui-font">✔ Auto</text>
  </g>
</svg>